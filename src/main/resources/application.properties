spring.config.import=optional:file:./config/ConfigApplication.properties

spring.application.name=project

# DEV ONLY: set true locally if you need automatic admin login.
app.dev-auto-login.enabled=false

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tourbookingdb
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== SQL Init (chạy mỗi lần khởi động) ====================
Tự chạy schema-init.sql để tạo bảng + seed roles (idempotent)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-init.sql

# ==================== JPA / Hibernate ====================
# validate  => kiểm tra schema khớp entity (dùng khi đã có database.sql)
# update    => tự động cập nhật schema (dùng khi dev)
# create    => tạo mới mỗi lần khởi động (cẩn thận: xóa data)
# none      => không làm gì (dùng khi production)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Chiến lược đặt tên cột: camelCase -> snake_case tự động
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Gemini AI
gemini.model=gemini-2.5-flash

# ==================== Google OAuth2 ====================
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ==================== SSL ====================
server.ssl.enabled=false
server.ssl.certificate=classpath:ssl/tourbooking.local.crt
server.ssl.certificate-private-key=classpath:ssl/tourbooking.local.key

# ==================== File Upload ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-part-count=200
server.tomcat.max-part-header-size=8KB
app.upload.dir=uploads/tours