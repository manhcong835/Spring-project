<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{client/fragments/head :: head('Đăng ký tài khoản', null)}"></head>
<body>
<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold"><span class="text-primary">✈️ Travel</span><span class="text-warning">er</span></h3>
                            <p class="text-muted">Tạo tài khoản để bắt đầu hành trình</p>
                        </div>
                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Họ</label>
                                    <input type="text" class="form-control" placeholder="Nguyễn" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Tên</label>
                                    <input type="text" class="form-control" placeholder="Văn A" required>
                                </div>
                            </div>
                            <div class="mb-3 mt-3">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" placeholder="email@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Số điện thoại</label>
                                <input type="tel" class="form-control" placeholder="0912 345 678" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" class="form-control" placeholder="Tối thiểu 8 ký tự" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" placeholder="Nhập lại mật khẩu" required>
                            </div>
                            <div class="form-check mb-4">
                                <input type="checkbox" class="form-check-input" id="agree" required>
                                <label class="form-check-label small" for="agree">Tôi đồng ý với <a href="#" class="text-decoration-none">điều khoản sử dụng</a> và <a href="#" class="text-decoration-none">chính sách bảo mật</a></label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg fw-semibold">Đăng ký</button>
                        </form>
                        <hr class="my-4">
                        <div class="d-grid mb-4">
                            <a th:href="@{/oauth2/authorization/google}" class="btn btn-light border py-2 fw-semibold d-flex align-items-center justify-content-center">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" width="20" class="me-2">
                                Đăng ký bằng Google
                            </a>
                        </div>
                        <p class="text-center mb-0 small">Đã có tài khoản? <a th:href="@{/login}" class="text-decoration-none fw-semibold">Đăng nhập</a></p>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a th:href="@{/}" class="text-white text-decoration-none small">← Quay về trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
