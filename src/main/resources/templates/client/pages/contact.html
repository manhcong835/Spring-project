<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{client/fragments/head :: head('Liên hệ', null)}"></head>
<body>
<div th:replace="~{client/fragments/header :: header}"></div>
<div th:replace="~{client/fragments/navbar :: navbar}"></div>
<section class="bg-primary text-white py-5 text-center">
    <div class="container"><h1 class="fw-bold display-5">Liên Hệ</h1><p class="lead opacity-75">Chúng tôi luôn sẵn sàng hỗ trợ bạn</p></div>
</section>
<section class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                    <h5 class="fw-bold mb-4">📞 Thông tin liên hệ</h5>
                    <div class="mb-3"><div class="fw-semibold">Hotline</div><a href="tel:19001234" class="text-decoration-none fs-5 text-primary fw-bold">1900 1234</a><div class="text-muted small">Hằng ngày 8:00 – 22:00</div></div>
                    <div class="mb-3"><div class="fw-semibold">Email</div><a href="mailto:info@traveler.vn" class="text-decoration-none">info@traveler.vn</a></div>
                    <div class="mb-3"><div class="fw-semibold">Địa chỉ</div><p class="text-muted mb-0">123 Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh</p></div>
                    <div><div class="fw-semibold mb-2">Mạng xã hội</div><div class="d-flex gap-2"><a href="#" class="btn btn-outline-primary btn-sm">📘 Facebook</a><a href="#" class="btn btn-outline-danger btn-sm">📷 Instagram</a><a href="#" class="btn btn-outline-dark btn-sm">💬 Zalo</a></div></div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-3">✉️ Gửi tin nhắn</h5>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label fw-semibold">Họ tên</label><input type="text" class="form-control" placeholder="Nguyễn Văn A"></div>
                            <div class="col-md-6"><label class="form-label fw-semibold">Email</label><input type="email" class="form-control" placeholder="email@example.com"></div>
                            <div class="col-md-6"><label class="form-label fw-semibold">Điện thoại</label><input type="tel" class="form-control" placeholder="0912 345 678"></div>
                            <div class="col-md-6"><label class="form-label fw-semibold">Chủ đề</label>
                                <select class="form-select"><option>Tư vấn tour</option><option>Hỗ trợ đặt tour</option><option>Khiếu nại</option><option>Hợp tác</option><option>Khác</option></select>
                            </div>
                            <div class="col-12"><label class="form-label fw-semibold">Nội dung</label><textarea class="form-control" rows="5" placeholder="Nhập nội dung tin nhắn..."></textarea></div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3 px-4">Gửi tin nhắn</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<div th:replace="~{client/fragments/footer :: footer}"></div>
</body>
</html>
