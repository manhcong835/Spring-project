<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{client/fragments/head :: head('Đánh giá tour', null)}"></head>
<body>
<div th:replace="~{client/fragments/header :: header}"></div>
<div th:replace="~{client/fragments/navbar :: navbar}"></div>
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card border-0 shadow-sm rounded-4 p-5">
                    <h3 class="fw-bold mb-2 text-center">⭐ Đánh Giá Tour</h3>
                    <p class="text-muted text-center mb-4">Chia sẻ trải nghiệm của bạn về chuyến đi</p>
                    <div class="card bg-light border-0 rounded-3 p-3 mb-4">
                        <div class="d-flex gap-3 align-items-center">
                            <img src="https://placehold.co/70x50/0d6efd/ffffff?text=PQ" alt="Tour" class="rounded">
                            <div><h6 class="fw-bold mb-0">Phú Quốc — Grand World — Vinpearl Safari</h6><small class="text-muted">4N3Đ • 15/04/2026 • Mã đơn: #BK001</small></div>
                        </div>
                    </div>
                    <form>
                        <div class="mb-4 text-center">
                            <label class="form-label fw-semibold d-block">Đánh giá sao</label>
                            <div class="fs-2">
                                <span class="text-warning" style="cursor:pointer;">★★★★★</span>
                            </div>
                            <small class="text-muted">Nhấp vào số sao tương ứng</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tiêu đề đánh giá</label>
                            <input type="text" class="form-control" placeholder="VD: Chuyến đi tuyệt vời!">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Nội dung đánh giá</label>
                            <textarea class="form-control" rows="5" placeholder="Chia sẻ chi tiết trải nghiệm của bạn: dịch vụ, hướng dẫn viên, ăn uống, khách sạn..."></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg flex-grow-1">Gửi đánh giá</button>
                            <a th:href="@{/booking/history}" class="btn btn-outline-secondary btn-lg">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<div th:replace="~{client/fragments/footer :: footer}"></div>
</body>
</html>
