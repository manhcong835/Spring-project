<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('Thêm khuyến mãi', null)}"></head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div class="admin-main">
    <div th:replace="~{admin/fragments/header :: header}"></div>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{admin/fragments/breadcrumb :: breadcrumb('Thêm khuyến mãi')}"></div>
        <h4 class="fw-bold mb-4">🎁 Thêm Khuyến Mãi Mới</h4>
        <div class="card admin-card">
            <div class="card-body p-4">
                <form>
                    <div class="row g-3">
                        <div class="col-md-8"><label class="form-label fw-semibold">Tên chương trình <span class="text-danger">*</span></label><input type="text" class="form-control" placeholder="VD: Ưu đãi mùa hè 2026" required></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Mã khuyến mãi</label><input type="text" class="form-control" placeholder="VD: KM005"></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Loại giảm giá <span class="text-danger">*</span></label><select class="form-select"><option>Phần trăm (%)</option><option>Số tiền cố định (VNĐ)</option></select></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Giá trị giảm <span class="text-danger">*</span></label><input type="number" class="form-control" placeholder="20"></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Giảm tối đa (VNĐ)</label><input type="number" class="form-control" placeholder="2000000"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Ngày bắt đầu</label><input type="date" class="form-control"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Ngày kết thúc</label><input type="date" class="form-control"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Số lượt sử dụng tối đa</label><input type="number" class="form-control" placeholder="100"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Giá trị đơn tối thiểu</label><input type="number" class="form-control" placeholder="3000000"></div>
                        <div class="col-12"><label class="form-label fw-semibold">Mô tả</label><textarea class="form-control" rows="3" placeholder="Mô tả chi tiết chương trình khuyến mãi..."></textarea></div>
                    </div>
                    <div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-primary">Tạo khuyến mãi</button><a th:href="@{/admin/promotions}" class="btn btn-outline-secondary">Hủy</a></div>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>
</body>
</html>
