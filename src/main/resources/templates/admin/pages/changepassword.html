<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('Đổi mật khẩu', null)}"></head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div class="admin-main">
    <div th:replace="~{admin/fragments/header :: header}"></div>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{admin/fragments/breadcrumb :: breadcrumb('Đổi mật khẩu')}"></div>
        <h4 class="fw-bold mb-4">🔒 Đổi Mật Khẩu</h4>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card admin-card">
                    <div class="card-body p-4">
                        <form><div class="mb-3"><label class="form-label fw-semibold">Mật khẩu hiện tại</label><input type="password" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label fw-semibold">Mật khẩu mới</label><input type="password" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label fw-semibold">Xác nhận mật khẩu mới</label><input type="password" class="form-control" required></div>
                        <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Cập nhật mật khẩu</button><a th:href="@{/admin/profile}" class="btn btn-outline-secondary">Hủy</a></div></form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>
</body>
</html>
