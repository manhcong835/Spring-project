<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('Xóa khuyến mãi', null)}"></head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div class="admin-main">
    <div th:replace="~{admin/fragments/header :: header}"></div>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{admin/fragments/breadcrumb :: breadcrumb('Xóa khuyến mãi')}"></div>
        <h4 class="fw-bold mb-4">🗑️ Xóa Khuyến Mãi</h4>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
                    <div class="fs-1 mb-3">⚠️</div>
                    <h5 class="fw-bold">Xác nhận xóa chương trình khuyến mãi?</h5>
                    <div class="card bg-light border-0 rounded-3 p-3 my-3 text-start small">
                        <div class="mb-1"><strong>Mã KM:</strong> KM004</div>
                        <div class="mb-1"><strong>Tên:</strong> Tết Nguyên Đán 2026</div>
                        <div><strong>Giảm:</strong> 15%</div>
                    </div>
                    <div class="d-flex gap-3 justify-content-center"><button class="btn btn-danger px-4" data-bs-toggle="modal" data-bs-target="#deletePromoModal">Xác nhận xóa</button><a th:href="@{/admin/promotions}" class="btn btn-outline-secondary px-4">Hủy bỏ</a></div>
                </div>
            </div>
        </div>
        <div th:replace="~{admin/fragments/modalconfirm :: modalconfirm('deletePromoModal', 'Xóa khuyến mãi', 'Chương trình KM004 sẽ bị xóa vĩnh viễn.', '/admin/promotions')}"></div>
    </main>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>
</body>
</html>
