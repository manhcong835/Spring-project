<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('Cập nhật trạng thái đơn', null)}"></head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div class="admin-main">
    <div th:replace="~{admin/fragments/header :: header}"></div>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{admin/fragments/breadcrumb :: breadcrumb('Cập nhật trạng thái')}"></div>
        <h4 class="fw-bold mb-4">📋 Cập Nhật Trạng Thái Đơn Đặt</h4>
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card admin-card">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Thông tin đơn #BK1257</h5>
                        <div class="row small mb-4">
                            <div class="col-6 mb-2"><strong>Khách hàng:</strong> Nguyễn Thị Lan</div>
                            <div class="col-6 mb-2"><strong>Điện thoại:</strong> 0912 345 678</div>
                            <div class="col-6 mb-2"><strong>Tour:</strong> Phú Quốc 4N3Đ</div>
                            <div class="col-6 mb-2"><strong>Ngày khởi hành:</strong> 15/04/2026</div>
                            <div class="col-6 mb-2"><strong>Số khách:</strong> 3 người</div>
                            <div class="col-6 mb-2"><strong>Tổng tiền:</strong> 12.970.000đ</div>
                        </div>
                        <hr>
                        <form>
                            <div class="mb-3"><label class="form-label fw-semibold">Trạng thái hiện tại</label><input type="text" class="form-control" value="Chờ xác nhận" readonly></div>
                            <div class="mb-3"><label class="form-label fw-semibold">Cập nhật trạng thái mới <span class="text-danger">*</span></label>
                                <select class="form-select"><option value="">Chọn trạng thái</option><option>Đã xác nhận</option><option>Đã thanh toán</option><option>Đã hoàn thành</option><option>Đã hủy</option></select>
                            </div>
                            <div class="mb-3"><label class="form-label fw-semibold">Ghi chú</label><textarea class="form-control" rows="3" placeholder="Ghi chú cho việc thay đổi trạng thái..."></textarea></div>
                            <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Cập nhật trạng thái</button><a th:href="@{/admin/bookings}" class="btn btn-outline-secondary">Quay lại</a></div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card admin-card">
                    <div class="card-header"><h6 class="fw-bold mb-0">📜 Lịch sử trạng thái</h6></div>
                    <div class="card-body">
                        <div class="d-flex gap-3 mb-3 small"><span class="badge bg-warning text-dark">Chờ xác nhận</span><span class="text-muted">02/04/2026 08:30</span></div>
                        <div class="d-flex gap-3 mb-3 small"><span class="badge bg-secondary">Đơn tạo mới</span><span class="text-muted">02/04/2026 08:25</span></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>
</body>
</html>
