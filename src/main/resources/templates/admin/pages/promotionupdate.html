<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('Cập nhật khuyến mãi', null)}"></head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div class="admin-main">
    <div th:replace="~{admin/fragments/header :: header}"></div>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{admin/fragments/breadcrumb :: breadcrumb('Cập nhật khuyến mãi')}"></div>
        <h4 class="fw-bold mb-4">✏️ Cập Nhật Khuyến Mãi</h4>
        <div class="card admin-card">
            <div class="card-body p-4">
                <form>
                    <div class="row g-3">
                        <div class="col-md-8"><label class="form-label fw-semibold">Tên chương trình</label><input type="text" class="form-control" value="Ưu đãi mùa hè 2026"></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Mã KM</label><input type="text" class="form-control" value="KM001" readonly></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Loại giảm giá</label><select class="form-select"><option selected>Phần trăm (%)</option><option>Số tiền cố định</option></select></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Giá trị giảm</label><input type="number" class="form-control" value="20"></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Giảm tối đa</label><input type="number" class="form-control" value="2000000"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Ngày bắt đầu</label><input type="date" class="form-control" value="2026-06-01"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Ngày kết thúc</label><input type="date" class="form-control" value="2026-08-31"></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Trạng thái</label><select class="form-select"><option selected>Đang áp dụng</option><option>Tạm dừng</option><option>Đã kết thúc</option></select></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Đã sử dụng</label><input type="text" class="form-control" value="45/100 lượt" readonly></div>
                        <div class="col-12"><label class="form-label fw-semibold">Mô tả</label><textarea class="form-control" rows="3">Giảm 20% cho tất cả tour du lịch mùa hè, áp dụng 01/06 - 31/08/2026.</textarea></div>
                    </div>
                    <div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-primary">Lưu thay đổi</button><a th:href="@{/admin/promotions}" class="btn btn-outline-secondary">Hủy</a></div>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>
</body>
</html>
