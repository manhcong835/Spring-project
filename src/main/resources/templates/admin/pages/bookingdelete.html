<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('Xóa đơn đặt', null)}"></head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div class="admin-main">
    <div th:replace="~{admin/fragments/header :: header}"></div>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{admin/fragments/breadcrumb :: breadcrumb('Xóa đơn đặt')}"></div>
        <h4 class="fw-bold mb-4">🗑️ Xóa Đơn Đặt Tour</h4>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
                    <div class="fs-1 mb-3">⚠️</div>
                    <h5 class="fw-bold">Xác nhận xóa đơn đặt tour?</h5>
                    <div class="card bg-light border-0 rounded-3 p-3 my-3 text-start small">
                        <div class="mb-1"><strong>Mã đơn:</strong> #BK1254</div>
                        <div class="mb-1"><strong>Khách hàng:</strong> Phạm Thị Hoa</div>
                        <div class="mb-1"><strong>Tour:</strong> Hạ Long 2N1Đ</div>
                        <div><strong>Tổng tiền:</strong> 5.180.000đ</div>
                    </div>
                    <div class="d-flex gap-3 justify-content-center"><button class="btn btn-danger px-4" data-bs-toggle="modal" data-bs-target="#deleteBookingModal">Xác nhận xóa</button><a th:href="@{/admin/bookings}" class="btn btn-outline-secondary px-4">Hủy bỏ</a></div>
                </div>
            </div>
        </div>
        <div th:replace="~{admin/fragments/modalconfirm :: modalconfirm('deleteBookingModal', 'Xóa đơn đặt tour', 'Đơn đặt #BK1254 sẽ bị xóa vĩnh viễn. Bạn có chắc chắn?', '/admin/bookings')}"></div>
    </main>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>
</body>
</html>
