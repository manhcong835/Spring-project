<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('Hồ sơ Admin', null)}"></head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div class="admin-main">
    <div th:replace="~{admin/fragments/header :: header}"></div>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{admin/fragments/breadcrumb :: breadcrumb('Hồ sơ')}"></div>
        <h4 class="fw-bold mb-4">📋 Hồ Sơ Quản Trị Viên</h4>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card admin-card text-center p-4">
                    <div class="mx-auto mb-3" style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#1a1a2e,#0f3460);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.5rem;font-weight:700;">AD</div>
                    <h5 class="fw-bold">Admin Traveler</h5>
                    <p class="text-muted small">admin@traveler.vn</p>
                    <span class="badge bg-primary rounded-pill">Quản trị viên</span>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card admin-card">
                    <div class="card-body p-4">
                        <form><div class="row g-3">
                            <div class="col-md-6"><label class="form-label fw-semibold">Họ tên</label><input type="text" class="form-control" value="Admin Traveler"></div>
                            <div class="col-md-6"><label class="form-label fw-semibold">Email</label><input type="email" class="form-control" value="admin@traveler.vn" readonly></div>
                            <div class="col-md-6"><label class="form-label fw-semibold">Số điện thoại</label><input type="tel" class="form-control" value="0901 000 000"></div>
                            <div class="col-md-6"><label class="form-label fw-semibold">Vai trò</label><input type="text" class="form-control" value="Quản trị viên" readonly></div>
                        </div><div class="mt-4"><button type="submit" class="btn btn-primary">Lưu thay đổi</button></div></form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>
</body>
</html>
