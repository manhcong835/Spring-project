<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('Khóa/Mở khóa tài khoản', null)}"></head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div class="admin-main">
    <div th:replace="~{admin/fragments/header :: header}"></div>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{admin/fragments/breadcrumb :: breadcrumb('Trạng thái tài khoản')}"></div>
        <h4 class="fw-bold mb-4">🔐 Khóa / Mở Khóa Tài Khoản Khách Hàng</h4>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm rounded-4 p-5 text-center">
                    <div class="fs-1 mb-3">🔐</div>
                    <h5 class="fw-bold">Thay Đổi Trạng Thái Tài Khoản</h5>
                    <div class="card bg-light border-0 rounded-3 p-3 my-3 text-start small">
                        <div class="mb-1"><strong>Khách hàng:</strong> Phạm Thị Hoa</div>
                        <div class="mb-1"><strong>Email:</strong> hoa.pham@email.com</div>
                        <div><strong>Trạng thái hiện tại:</strong> <span class="badge bg-danger rounded-pill">Bị khóa</span></div>
                    </div>
                    <form>
                        <div class="mb-3 text-start"><label class="form-label fw-semibold">Trạng thái mới</label>
                            <select class="form-select"><option>Hoạt động (Mở khóa)</option><option>Bị khóa (Khóa)</option></select>
                        </div>
                        <div class="mb-3 text-start"><label class="form-label fw-semibold">Lý do</label><textarea class="form-control" rows="3" placeholder="Nhập lý do thay đổi trạng thái...">Vi phạm chính sách sử dụng dịch vụ.</textarea></div>
                        <div class="d-flex gap-3 justify-content-center"><button type="submit" class="btn btn-primary px-4">Cập nhật</button><a th:href="@{/admin/customers}" class="btn btn-outline-secondary px-4">Hủy</a></div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>
</body>
</html>
