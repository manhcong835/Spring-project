<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{admin/fragments/head :: head('Cập nhật tour', null)}"></head>
<body>
<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
<div class="admin-main">
    <div th:replace="~{admin/fragments/header :: header}"></div>
    <main class="flex-grow-1 p-4">
        <div th:replace="~{admin/fragments/breadcrumb :: breadcrumb('Cập nhật tour')}"></div>
        <h4 class="fw-bold mb-4">✏️ Cập Nhật Tour</h4>
        <div class="card admin-card">
            <div class="card-body p-4">
                <form>
                    <div class="row g-3">
                        <div class="col-md-8"><label class="form-label fw-semibold">Tên tour</label><input type="text" class="form-control" value="Phú Quốc — Grand World — Vinpearl Safari"></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Mã tour</label><input type="text" class="form-control" value="T001" readonly></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Điểm đến</label><select class="form-select"><option>Phú Quốc</option><option selected>Kiên Giang</option><option>Đà Nẵng</option></select></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Nơi khởi hành</label><select class="form-select"><option selected>TP. Hồ Chí Minh</option><option>Hà Nội</option></select></div>
                        <div class="col-md-4"><label class="form-label fw-semibold">Thời gian</label>
                            <div class="row g-2">
                                <div class="col-6"><input type="number" class="form-control" value="4" min="1"></div>
                                <div class="col-6"><input type="number" class="form-control" value="3" min="0"></div>
                            </div>
                        </div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Phương tiện</label><select class="form-select"><option selected>Máy bay</option><option>Ô tô</option><option>Tàu hỏa</option></select></div>
                        <div class="col-md-6"><label class="form-label fw-semibold">Trạng thái</label><select class="form-select"><option selected>ACTIVE</option><option>INACTIVE</option><option>DELETED</option></select></div>
                        <div class="col-12"><label class="form-label fw-semibold">Mô tả</label><textarea class="form-control" rows="4">Tour Phú Quốc 4 ngày 3 đêm trải nghiệm thiên đường biển đảo hàng đầu Việt Nam.</textarea></div>
                    </div>

                    <!-- ===== SECTION: Lịch Khởi Hành ===== -->
                    <hr class="my-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">📅 Lịch Khởi Hành</h5>
                        <button type="button" class="btn btn-outline-primary btn-sm" id="btnToggleDepartureForm">
                            + Thêm chuyến
                        </button>
                    </div>

                    <!-- Form thêm chuyến (ẩn mặc định) -->
                    <div class="card bg-light border mb-3" id="departureFormCard" style="display:none;">
                        <div class="card-body">
                            <div class="row g-2">
                                <div class="col-md-3">
                                    <label class="form-label small fw-semibold">Ngày đi <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control form-control-sm" id="depDate">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-semibold">Ngày về <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control form-control-sm" id="depReturnDate">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label small fw-semibold">Giá người lớn <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control form-control-sm" placeholder="63900000" id="depAdultPrice">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label small fw-semibold">Giá trẻ em</label>
                                    <input type="number" class="form-control form-control-sm" placeholder="44730000" id="depChildPrice">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label small fw-semibold">Giá trẻ nhỏ</label>
                                    <input type="number" class="form-control form-control-sm" placeholder="0" id="depInfantPrice">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label small fw-semibold">Sức chứa <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control form-control-sm" placeholder="30" id="depCapacity">
                                </div>
                                <div class="col-md-10 d-flex align-items-end gap-2">
                                    <button type="button" class="btn btn-primary btn-sm" id="btnAddDeparture">Thêm chuyến</button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btnCancelDeparture">Hủy</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bảng departures với dữ liệu mẫu -->
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Ngày đi</th>
                                    <th>Ngày về</th>
                                    <th>Giá NL (VNĐ)</th>
                                    <th>Giá TE</th>
                                    <th>Sức chứa</th>
                                    <th>Còn trống</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="departureTableBody">
                                <tr>
                                    <td>1</td>
                                    <td>25/05/2026</td>
                                    <td>28/05/2026</td>
                                    <td>63.900.000</td>
                                    <td>44.730.000</td>
                                    <td>30</td>
                                    <td>12</td>
                                    <td><span class="badge bg-success rounded-pill">OPEN</span></td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <button type="button" class="btn btn-outline-primary">Sửa</button>
                                            <button type="button" class="btn btn-outline-danger">Xóa</button>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td>29/05/2026</td>
                                    <td>01/06/2026</td>
                                    <td>63.900.000</td>
                                    <td>44.730.000</td>
                                    <td>30</td>
                                    <td>8</td>
                                    <td><span class="badge bg-success rounded-pill">OPEN</span></td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <button type="button" class="btn btn-outline-primary">Sửa</button>
                                            <button type="button" class="btn btn-outline-danger">Xóa</button>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>3</td>
                                    <td>17/06/2026</td>
                                    <td>20/06/2026</td>
                                    <td>70.500.000</td>
                                    <td>49.350.000</td>
                                    <td>30</td>
                                    <td>0</td>
                                    <td><span class="badge bg-danger rounded-pill">FULL</span></td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <button type="button" class="btn btn-outline-primary">Sửa</button>
                                            <button type="button" class="btn btn-outline-danger">Xóa</button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- ===== END SECTION ===== -->

                    <div class="mt-4 d-flex gap-2"><button type="submit" class="btn btn-primary">Lưu thay đổi</button><a th:href="@{/admin/tours}" class="btn btn-outline-secondary">Hủy</a></div>
                </form>
            </div>
        </div>
    </main>
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('btnToggleDepartureForm');
    const formCard = document.getElementById('departureFormCard');
    const cancelBtn = document.getElementById('btnCancelDeparture');

    toggleBtn.addEventListener('click', () => { formCard.style.display = 'block'; toggleBtn.style.display = 'none'; });
    cancelBtn.addEventListener('click', () => { formCard.style.display = 'none'; toggleBtn.style.display = ''; });
});
</script>
</body>
</html>
